[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-simulator"
version = "0.3.8"
description = "Deterministic offline telemetry and fault simulator for A.R.M.O.R."
requires-python = ">=3.11"

[project.optional-dependencies]
mqtt = ["paho-mqtt"]

[project.scripts]
armor-simulator = "armor_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
# The shared contract package lives in a sibling checkout and is imported only when present; paho-mqtt is imported only by the link of the simulated panel and is optional.
module = ["armor_common", "armor_common.*", "paho", "paho.*"]
ignore_missing_imports = true
