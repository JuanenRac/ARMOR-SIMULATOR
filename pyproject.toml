[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-simulator"
version = "0.2.1"
description = "Deterministic offline telemetry and fault simulator for A.R.M.O.R."
requires-python = ">=3.11"

[project.scripts]
armor-simulator = "armor_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
