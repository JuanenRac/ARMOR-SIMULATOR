# Jobs that run the software of the system against a simulated installation, without any hardware and without Docker:
#   * firmware in the loop: the buses of the five nodes, spoiled on purpose, played into the real firmware code of each node (python -m armor_simulator.node_bench)
#   * server bench: a real, built ARMOR-SERVER fed by the simulator over HTTP and through a broker (python -m armor_simulator.bench_ci), also by the message code of the radar node built for this machine
# They are a workflow of their own, apart from the baseline one, so that a red bench is easy to tell from a red baseline.
# A green run says the software works against a simulated installation; it says nothing about a board.
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  firmware-in-the-loop:
    name: Buses of the five nodes into their firmware code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Fetch the node repositories
        run: |
          for repository in ARMOR-NODE-ALARM ARMOR-NODE-ELECTRICAL ARMOR-NODE-HMI ARMOR-NODE-RADAR ARMOR-NODE-SOLAR; do
            git clone --depth 1 "https://github.com/JuanenRac/${repository}.git" "../${repository}"
          done

      - name: Build the five drivers and play every bus into its own
        env:
          PYTHONPATH: src
        run: |
          status=0
          for pair in ARMOR-NODE-RADAR:ld2450 ARMOR-NODE-ELECTRICAL:pzem ARMOR-NODE-SOLAR:pylontech ARMOR-NODE-ALARM:alarm-loop ARMOR-NODE-HMI:hmi-feed; do
            repository="${pair%%:*}"
            bus="${pair##*:}"
            g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 -o "/tmp/sim_bench_${bus}" "../${repository}/tests/sim_bench.cpp" || status=1
            python -m armor_simulator.node_bench --bus "${bus}" --driver "/tmp/sim_bench_${bus}" || status=1
          done
          exit "${status}"

  server-bench:
    name: Real server fed by the simulator (HTTP and MQTT)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the server the bench runs
        run: git clone --depth 1 https://github.com/JuanenRac/ARMOR-SERVER.git ../ARMOR-SERVER

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the server
        working-directory: ../ARMOR-SERVER
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install a broker and the MQTT client of the simulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes mosquitto
          sudo systemctl stop mosquitto || true
          python -m pip install --quiet paho-mqtt

      - name: Build the message code of the radar, electrical, solar and alarm nodes as programs for this machine
        run: |
          git clone --depth 1 https://github.com/JuanenRac/ARMOR-NODE-RADAR.git ../ARMOR-NODE-RADAR
          git clone --depth 1 https://github.com/JuanenRac/ARMOR-NODE-ELECTRICAL.git ../ARMOR-NODE-ELECTRICAL
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 -o /tmp/mqtt_shim ../ARMOR-NODE-RADAR/tests/mqtt_shim.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 -o /tmp/mqtt_shim_electrical ../ARMOR-NODE-ELECTRICAL/tests/mqtt_shim.cpp
          git clone --depth 1 https://github.com/JuanenRac/ARMOR-NODE-SOLAR.git ../ARMOR-NODE-SOLAR
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 -o /tmp/mqtt_shim_solar ../ARMOR-NODE-SOLAR/tests/mqtt_shim.cpp
          git clone --depth 1 https://github.com/JuanenRac/ARMOR-NODE-ALARM.git ../ARMOR-NODE-ALARM
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 -o /tmp/mqtt_shim_alarm ../ARMOR-NODE-ALARM/tests/mqtt_shim.cpp

      - name: Run the bench
        env:
          PYTHONPATH: src
        run: python -m armor_simulator.bench_ci --server-dir ../ARMOR-SERVER --mosquitto auto --shim-driver /tmp/mqtt_shim --shim-electrical-driver /tmp/mqtt_shim_electrical --shim-solar-driver /tmp/mqtt_shim_solar --shim-alarm-driver /tmp/mqtt_shim_alarm
