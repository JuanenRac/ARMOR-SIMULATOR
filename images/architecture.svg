<text x="36" y="70" font-family="'Segoe UI','Noto Sans','Noto Sans CJK SC','Microsoft YaHei','Yu Gothic','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8B949E" text-anchor="start">Plays a radar node, a solar gateway and an electrical node, with faults you can repeat, so the rest of the family works without hardware.</text>
