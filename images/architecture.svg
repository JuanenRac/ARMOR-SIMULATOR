<title id="t">ARMOR-SIMULATOR architecture</title>
<desc id="d">ARMOR-SIMULATOR makes the messages of a radar node, an inverter with its batteries and an electrical node, checks them against ARMOR-COMMON when asked, and prints them or delivers them to ARMOR-SERVER, which ARMOR-STUDIO and the phone app then show.</desc>
